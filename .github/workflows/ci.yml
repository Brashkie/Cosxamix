name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push que llega mientras todavia corre el anterior cancela al viejo: lo
# unico que importa saber es si el ultimo commit esta bien.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # OJO: aca NO va `RUSTFLAGS`.
  #
  # La variable de entorno RUSTFLAGS **reemplaza** a los `rustflags` de
  # `[target.*]` de `.cargo/config.toml`, no se suma a ellos. Poner aqui algo
  # tan inocente como `RUSTFLAGS: -D warnings` borraria el
  # `target-cpu=x86-64-v3`, que son 4x de rendimiento medidos, y nada en la
  # salida de CI lo diria: compila, pasa los tests, y el binario sale cuatro
  # veces mas lento.
  #
  # Los avisos se deniegan pasandoselos a clippy como argumento suyo
  # (`-- -D warnings`), que no toca la configuracion de cargo.

jobs:
  # ── Lo que tiene que andar en las tres plataformas ───────────────────────
  comprobar:
    name: ${{ matrix.os }} · ${{ matrix.features == '' && 'sin features' || matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Sin features: solo la capa HTTP, 6 crates. Con `candle`: el motor de
        # verdad, 155 crates. Se prueban las dos porque la capa HTTP tiene que
        # seguir compilando sola — es lo que permite tocarla sin pagar el
        # minuto y medio del motor.
        #
        # `asm_q4k` EJECUTA el kernel fusionado de Q4_K escrito en ensamblador
        # contra la referencia. Es la unica forma de correr el de System V: se
        # desarrolla en Windows, donde solo se puede ensamblar. En
        # `ubuntu-latest` corre el de ELF y en `windows-latest` el de COFF; en
        # `macos-latest`, que es ARM, el modulo no existe y no se prueba —el de
        # Mach-O x86-64 solo lo ensambla el job `ensamblador`, no lo ejecuta—.
        #
        # `asm_q3k` hace lo mismo con el de Q3_K, que ademas se compara bit a bit
        # contra los intrinsecos: es el mismo algoritmo en el mismo orden.
        features: ['', 'candle', 'training', 'asm_q4k', 'asm_q3k']
    steps:
      - uses: actions/checkout@v4

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.features }}-

      - name: Versiones
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      # Solo en una plataforma y una combinacion: el formato no depende del
      # sistema y correrlo seis veces no agrega informacion.
      - name: Formato
        if: matrix.os == 'ubuntu-latest' && matrix.features == ''
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: |
          set -eu
          if [ -z "${{ matrix.features }}" ]; then
            cargo clippy --all-targets -- -D warnings
          else
            cargo clippy --features "${{ matrix.features }}" --all-targets -- -D warnings
          fi

      # Ningun test carga un modelo: todos son unitarios y los que necesitan un
      # GGUF son ejemplos, no tests. Por eso CI no baja 1,6 GB.
      - name: Tests
        shell: bash
        run: |
          set -eu
          if [ -z "${{ matrix.features }}" ]; then
            cargo test
          else
            cargo test --features "${{ matrix.features }}"
          fi

  # ── Los kernels de Zig ───────────────────────────────────────────────────
  zig:
    name: kernels de Zig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-zig-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-zig-

      - uses: ./.github/actions/instalar-zig

      - name: Clippy
        run: cargo clippy --features zig,candle,c --all-targets -- -D warnings

      # Entre los 22 hay seis que comparan cada backend contra la referencia
      # escalar con la misma entrada. Son los que demuestran que el kernel de
      # Zig calcula lo mismo que el de Rust, que es lo unico que justifica
      # tenerlo.
      # Con `c`, tambien el kernel de C (`zig cc`, el mismo Zig de arriba).
      - name: Tests
        run: cargo test --features zig,candle,c

      # La compilación para las CPU sin AVX2: Rust en el x86-64 básico, y Zig
      # con sus dos copias. Aquí SÍ va RUSTFLAGS, a propósito: es la forma de
      # sacar el `target-cpu` del config. COSXAMIX_SIN_AVX2 hace que el runner,
      # que tiene AVX2, corra el camino de una CPU que no lo tiene. Sin candle:
      # recompilarlo sin target-cpu son minutos, y lo que se prueba son los
      # kernels.
      - name: Tests sin AVX2 (Rust y Zig en baseline)
        env:
          RUSTFLAGS: -C target-cpu=x86-64
          CARGO_TARGET_DIR: target/baseline
          COSXAMIX_SIN_AVX2: "1"
        run: cargo test --features zig

      - name: Tests sin AVX2, copia v3 de Zig elegida
        env:
          RUSTFLAGS: -C target-cpu=x86-64
          CARGO_TARGET_DIR: target/baseline
        run: cargo test --features zig

      - name: Que el kernel compilado sea x86-64
        run: python3 scripts/check_kernel_arch.py "" x86_64

  # ── Que el camino de ARM exista de verdad ────────────────────────────────
  #
  # Este job no esta por completitud. DECISIONES.md §3 dice que Zig se queda
  # PORQUE es la unica ruta vectorizada en ARM y Android — en x86-64 pierde
  # entre 3% y 8% contra el AVX2 de Rust, y por velocidad sola la regla 3 lo
  # borraria. Si cruzar dejara de funcionar, esa afirmacion seria falsa y los
  # binarios de ARM saldrian con kernels escalares sin que nada avisara.
  #
  # Ya atrapo un fallo real: `build.rs` pasaba `-target=X` en un argumento y
  # Zig lo quiere en dos, al reves que `-femit-bin=`.
  cruzar:
    name: cruzar a aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/instalar-zig

      # Solo `gcc-`, no `g++-`: Cosxamix es Rust y Zig, sin una linea de C++, y
      # el .a que produce Zig no llama ni a libc. Si alguna vez entra una
      # dependencia de C++ hay que cambiarlo por `g++-aarch64-linux-gnu`, y el
      # sintoma sera un `cannot find -lstdc++` al final de compilar los 155
      # crates, un error que no menciona que falte un paquete.
      - name: Linker de ARM
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - run: rustup target add aarch64-unknown-linux-gnu

      # Clippy para un target que no es x86 ni Windows, que es donde se ven los
      # fallos escondidos tras un `cfg`. Compilar para una sola plataforma no
      # puede encontrarlos por definicion: el codigo que rompe es justo el que
      # alli no se compila.
      #
      # Ya encontro dos reales en el primer push: `examples/measure_memory.rs`
      # tenia dos `memoria_mb` y a la de Windows le faltaba su `#[cfg(windows)]`,
      # asi que fuera de Windows quedaban las dos definidas (E0428); y el `mut`
      # de `kernels::disponibles()` no hace falta en un ARM sin la feature `zig`,
      # porque alli no se empuja nada.
      #
      # Esta antes de compilar a proposito: tarda menos y el mensaje es mejor.
      - name: Clippy para ARM
        run: |
          cargo clippy --all-targets --target aarch64-unknown-linux-gnu -- -D warnings
          cargo clippy --features zig,candle --all-targets --target aarch64-unknown-linux-gnu -- -D warnings

      - name: Compilar
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --features zig,candle --target aarch64-unknown-linux-gnu

      # Que compile no prueba que el kernel sea de ARM: con el bug del
      # `-target`, Zig producia un .a de x86-64 igual de valido para el
      # archivador y con los simbolos correctos. Hay que mirar la cabecera ELF.
      - name: Que el kernel sea AArch64 de verdad
        run: python3 scripts/check_kernel_arch.py aarch64-unknown-linux-gnu aarch64

      - name: Que el binario sea AArch64
        run: |
          file target/aarch64-unknown-linux-gnu/release/cosxamix
          file target/aarch64-unknown-linux-gnu/release/cosxamix | grep -q 'ARM aarch64'

  # ── Ejecutar en ARM, no solo compilar ────────────────────────────────────
  #
  # `cruzar` demuestra que el camino de ARM compila; este lo EJECUTA, en un
  # runner ARM64 nativo. Hace falta por el kernel NEON de Q4_K
  # (`kernels/q4k_neon.s`): la maquina de desarrollo es x86-64 y no puede
  # correrlo, y sin esto el unico lugar donde se probaria es un telefono.
  #
  # Los runners ARM de GitHub son Neoverse N2, que tiene `dotprod`, asi que los
  # tests del kernel corren de verdad y no salen por el `return` de "esta CPU no
  # tiene sdot". Mientras `q4k_neon.s` no exista, el modulo no se compila y el
  # job prueba igual el de Zig en ARM, que es el que el NEON tiene que superar.
  arm:
    name: ejecutar en ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/instalar-zig

      - name: Que esta CPU tenga sdot
        # En bloque `|` y no en una linea: un `: ` dentro de un `run:` en linea
        # YAML lo lee como otra clave, y el archivo entero deja de ser valido.
        # Paso en la 0.4.0: CI no corrio y GitHub no lo muestra como un check
        # fallido del commit, solo como "workflow file issue" en Actions.
        run: |
          grep -m1 -o -w asimddp /proc/cpuinfo || echo "SIN dotprod, los tests del kernel NEON se saltan"

      # Con `c`: los kernels de `kernels/neon_dotprod.c`, con `sdot`. Este es
      # el UNICO lugar donde corren: la maquina de desarrollo es x86-64.
      - name: Clippy
        run: cargo clippy --features zig,asm_q4k,c --all-targets -- -D warnings

      - name: Tests
        run: cargo test --features zig,asm_q4k,c

      # No decide nada —un runner compartido mide con ruido y no es el telefono—,
      # pero deja en el log el orden de magnitud de escalar, Zig y NEON en la
      # misma maquina, que es la comparacion que importa.
      - name: Bench del fusionado
        run: cargo bench --features zig,asm_q4k,c --bench kernels -- dot_q4k_i8 --warm-up-time 1 --measurement-time 3

  # -- Que el ensamblador ensamble en los tres formatos de objeto ----------
  #
  # El kernel de `kernels/*.s` depende de TRES cosas de la plataforma, no de
  # una: la convencion de llamada, el formato de objeto y como se decoran los
  # simbolos. Un `.type sym, @function` es valido en ELF y el ensamblador de
  # Mach-O lo rechaza con "unknown directive" -- y eso tiro un release despues
  # de compilar 155 crates.
  #
  # Este job lo caza en segundos. Es `cargo build --lib` y NO `cargo check`:
  # `check` no genera codigo, asi que nunca ensambla el `global_asm!` y pasa
  # aunque el archivo este roto. Comprobado reintroduciendo el bug a proposito.
  #
  # Y es `--lib` para que no haga falta ningun SDK: compilar a rlib no enlaza.
  ensamblador:
    name: ensamblador en los tres formatos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-unknown-linux-gnu aarch64-apple-darwin
      # Con `asm_q4k`: sin la feature los `.s` de Q4_K no entran al build y
      # este job no los veria.
      - name: ELF
        run: cargo build --lib --features asm_q4k,asm_q3k --target x86_64-unknown-linux-gnu
      - name: Mach-O
        run: cargo build --lib --features asm_q4k,asm_q3k --target x86_64-apple-darwin
      # El NEON es un solo archivo para ELF y Mach-O, y Mach-O es el que
      # rechaza directivas: aca se ve antes que en un Mac.
      # Con `c`: el `neon_dotprod.c` cruzado por `zig cc` a los dos formatos.
      - uses: ./.github/actions/instalar-zig
      - name: ARM64 ELF
        run: cargo build --lib --features asm_q4k,c --target aarch64-unknown-linux-gnu
      - name: ARM64 Mach-O
        run: cargo build --lib --features asm_q4k,c --target aarch64-apple-darwin
      # COFF lo cubre la matriz de Windows, que compila el binario entero.


  # ── Documentacion ────────────────────────────────────────────────────────
  #
  # Los tres fallos que aparecieron de verdad —tabla con una fila de distinto
  # ancho, enlace relativo a un archivo renombrado, y un nombre viejo del
  # proyecto sobreviviendo a un renombrado— no los ve el compilador.
  docs:
    name: documentacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs.py
