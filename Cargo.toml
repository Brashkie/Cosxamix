[package]
name = "cosxamix"
version = "0.11.0"
edition = "2021"
description = "Runtime de IA que sirve modelos de lenguaje por HTTP, compatible con el dialecto de Ollama"
license     = "GPL-3.0-or-later"
repository  = "https://github.com/Brashkie/Cosxamix"
readme      = "README.md"
keywords    = ["llm", "inference", "gguf", "quantization", "ollama"]
categories  = ["science", "command-line-utilities"]
build       = "build.rs"

[dependencies]
# Mismas versiones que la Session API de WinsiBot: los dos proyectos se van a
# tocar, y tener axum 0.7 de un lado y 0.8 del otro solo traería trabajo.
axum               = "0.7"
tokio              = { version = "1", features = ["full"] }
# Solo por `ReceiverStream`, que convierte el canal del generador en el flujo
# que pide la respuesta SSE. Se declara aunque sea una linea: viene del equipo
# de tokio, pero es una dependencia que usa el codigo propio.
tokio-stream       = "0.1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Mapear el archivo de pesos en memoria virtual en vez de copiarlo al monticulo.
# Un crate de 0 dependencias que envuelve `mmap` de POSIX y
# `CreateFileMapping`/`MapViewOfFile` de Windows; escribirlo a mano seria
# `unsafe` por plataforma para ahorrar una dependencia que no arrastra nada.
memmap2            = "0.9"

# El motor propio reparte su trabajo en hilos. El pool de rayon se configura a
# mano al arrancar y num_cpus es lo unico que distingue nucleos fisicos de
# logicos — available_parallelism() devuelve 12 en un i5-10400 que tiene 6.
# Hasta la 0.10.0 tambien estaba candle (155 crates); desde la 0.11.0 el motor,
# las imagenes y el entrenamiento son propios y no hay candle en ninguna parte.
rayon               = "1"
num_cpus            = "1"

# NFC, que es lo que un `tokenizer.json` pide antes de tokenizar. Sin
# dependencias salvo tinyvec, y ya llegaba de rebote por `tokenizers` en otra
# version.
unicode-normalization = "0.1"

[profile.release]
lto           = true
codegen-units = 1
strip         = true

[features]
# Los kernels en Zig NO entran por defecto: sin esto, Cosxamix compila y funciona
# con la referencia en Rust y con AVX2, y no hace falta tener Zig instalado.
#
#   cargo build --release --features zig
zig = []

# Kernels en C, compilados con `zig cc`: piden Zig instalado y nada más. Hoy,
# el fusionado de Q3_K para x86-64 (kernels/q3k_avx2.c).
#
#   cargo bench --features c --bench kernels -- q3k
c = []

# El kernel fusionado de Q4_K escrito a mano. Apagada por defecto, y no es
# cosmetico: sin ella `src/kernels/q4k_asm.rs` no se compila y la ausencia de
# los dos `.s` no rompe nada. Se enciende cuando esos archivos existan.
#
#   cargo test --features asm_q4k
asm_q4k = []

# El kernel fusionado de Q3_K en ensamblador (kernels/q3k_avx2_*.s), para
# medirlo contra los intrinsecos y contra el de C.
#
#   cargo bench --features asm_q3k --bench kernels -- q3k
asm_q3k = []

# Entrenamiento: LoRA sobre Qwen y daiss desde cero, con el backward escrito a
# mano (src/training/). Va aparte porque quien solo quiera servir no tiene por
# que compilarlo; no suma ninguna dependencia.
#
#   cargo run --release --features training --example train_lora
training = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Solo para comprobar que el tokenizador propio da lo mismo, token por token
# (tests/tokenizer_json.rs). El motor no lo usa desde la 0.8.0.
#
# `default-features = false` NO es cosmetico: por defecto trae el feature
# `onig`, que es Oniguruma —una libreria de C— y rompe la compilacion cruzada a
# Android. El camino alternativo usa fancy-regex, que es Rust puro.
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }

[[bench]]
name    = "kernels"
harness = false

[[example]]
name = "measure_lora"
required-features = ["training"]

[[example]]
name = "check_training_model"
required-features = ["training"]

[[example]]
name = "train_lora"
required-features = ["training"]

[[example]]
name = "train_daiss"
required-features = ["training"]

[[example]]
name = "measure_tensor_train"
required-features = ["training"]
